name: 'GDSS PR Collision Radar'
description: 'Detect cross-branch semantic collisions across concurrent pull requests and generate validated convergence patches'
author: 'Sarthak Basnet'
branding:
  icon: 'git-merge'
  color: 'blue'

inputs:
  token:
    description: 'GitHub Token for querying concurrent open pull requests, posting sticky radar reports, and calling GitHub Models'
    required: true
    default: ${{ github.token }}

runs:
  using: 'docker'
  image: 'docker://ghcr.io/sarthak2233/gdss-runner:latest'
  env:
    GITHUB_TOKEN: ${{ inputs.token }}
  args:
    - 'audit-pr'
